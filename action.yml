name: 'Enov8 - Deployment Version Update'
description: 'Update (or create) Enov8 CMDB resources (Environment Instance, System Component, System Interface, MicroService) version via GitHub Actions.'
author: 'Enov8 Ltd'

branding:
  icon: 'layers'
  color: 'green'

inputs:
  resourceType:
    description: 'Supported values: Environment Instance | System Component | System Interface | MicroService'
    required: true

  resourceName:
    description: 'Exact name of the Enov8 resource to update'
    required: true

  systemInstance:
    description: 'Required when resourceType is MicroService'
    required: false

  version:
    description: 'Version value to update'
    required: true

  autocreate:
    description: 'Boolean. When true, create resourceName if it does not already exist (using metadata). When false (default), a not-found resourceName is always an error. Can be written unquoted (true/false) in the workflow YAML.'
    required: false
    default: 'false'

  metadata:
    description: 'Used when autocreate is true and resourceName does not exist yet. For Environment Instance/System Interface/MicroService: "Status" (default "InOperation"), "System", "Environment", "Business Unit" (default "Other"), "Type" (default "Other"), "Core" (default "False") — "System"/"Environment" resolved by name automatically; "Business Unit"/"Type"/"Core" only used if "System" also needs creating, Type must be a value configured in your tenant System Type picklist (e.g. Other, Cloud, Azure, AWS, GCP, Windows, Linux, Mainframe, Non-Mainframe, Middleware, Container, Interface, MicroService, Legacy, PC Client Server). Example: {"System": "GDW", "Environment": "DEV Env"}. When resourceType is MicroService, this cascade-creates systemInstance (and its System) before the MicroService. For System Component (no System/Environment dependency): "Status" (default "InOperation"), "Type" (REQUIRED, no default — a separate tenant-specific Component Type picklist, e.g. Server, Database, Module, Integration), "Monitored" (default "False"). Example: {"Type": "Server"}. In all cases, "Assigned To" and "Organisation" are always resolved automatically and must not be supplied.'
    required: false

  app_id:
    description: 'Enov8 App ID'
    required: true

  app_key:
    description: 'Enov8 App Key'
    required: true

  enov8_url:
    description: 'Base URL of your Enov8 instance (Example: https://yourcompany.enov8.cloud/ecosystem)'
    required: true

  insecure_skip_tls_verify:
    description: 'Set to true to skip TLS verification (not recommended)'
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'
